<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-label="Reza Tavakoli, Full-Stack Developer, Founder, Mentor">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b3b"/><stop offset="1" stop-color="#0b0618"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#F3E8FF"/><stop offset="0.55" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#A78BFA" opacity="0.22"/></pattern>
<clipPath id="rd"><rect width="800" height="240" rx="20"/></clipPath>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.fl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:24px;fill:#A78BFA;opacity:.3;animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-14px);opacity:.42}}
.o1{animation:dr 9s ease-in-out infinite}
.o2{animation:dr 11s ease-in-out infinite reverse}
@keyframes dr{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
.scan{animation:sc 6s linear infinite}
@keyframes sc{from{transform:translateY(-10px)}to{transform:translateY(250px)}}
.rise{animation:rs 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rs{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.blink{animation:bk 1s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
.bd{animation:bdr 4s ease-in-out infinite}
@keyframes bdr{0%,100%{stroke-opacity:.4}50%{stroke-opacity:.95}}
</style>
<g clip-path="url(#rd)">
<rect width="800" height="240" fill="url(#bg)"/>
<rect width="800" height="240" fill="url(#dots)"/>
<circle class="o1" cx="660" cy="50" r="90" fill="#7C3AED" opacity=".4" filter="url(#bl)"/>
<circle class="o2" cx="120" cy="215" r="80" fill="#A78BFA" opacity=".22" filter="url(#bl)"/>
<text class="fl" x="600" y="70" style="animation-delay:0s">&lt;/&gt;</text><text class="fl" x="700" y="140" style="animation-delay:1.2s">{ }</text><text class="fl" x="620" y="200" style="animation-delay:2.1s">PHP</text><text class="fl" x="720" y="60" style="animation-delay:3s">SQL</text><text class="fl" x="560" y="120" style="animation-delay:0.6s">$_</text><text class="fl" x="730" y="205" style="animation-delay:1.8s">01</text>
<rect class="scan" x="0" y="0" width="800" height="2" fill="#C4B5FD" opacity=".14"/>
<text class="mono rise" x="48" y="68" font-size="20" fill="#C4B5FD" style="animation-delay:.1s">// hello, world. i'm</text>
<text class="sans rise" x="46" y="135" font-size="56" font-weight="800" letter-spacing="2" fill="url(#nm)" style="animation-delay:.3s">REZA TAVAKOLI</text>
<text class="sans rise" x="48" y="178" font-size="24" fill="#EDE9FE" style="animation-delay:.6s">Full-Stack Developer · Founder · Mentor</text>
<text class="mono rise" x="48" y="210" font-size="22" fill="#A78BFA" style="animation-delay:.9s">&gt; building things people use<tspan class="blink">_</tspan></text>
</g>
<rect class="bd" x="1.5" y="1.5" width="797" height="237" rx="19" fill="none" stroke="#7C3AED" stroke-width="2"/>
</svg>